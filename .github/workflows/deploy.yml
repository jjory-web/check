name: Validate and deploy beta package
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beta-source
    steps:
      - uses: actions/checkout@v4
      - name: Extract prepared beta source
        working-directory: .
        run: unzip check-beta-public-ready.zip -d beta-source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: beta-build
          path: beta-source/dist
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: beta-source/dist
      - uses: actions/deploy-pages@v4
        if: github.ref == 'refs/heads/main'
